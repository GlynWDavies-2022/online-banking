<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Online Banking</title>
</head>

<body>
    <!-- Navigation Bar -->
    <nav>
        <img src="images/online-banking-image.png" alt="Logo" class="logo">
        <p class="welcome-message">Welcome! Log in to get started</p>
        <form class="form-login">
            <input type="text" placeholder="user" class="form-input">
            <input type="password" placeholder="pin" maxlength="4" class="form-input">
            <button class="button-login">Login</button>
        </form>
    </nav>
    <!-- Main Content Area -->
    <main class="application">
        <!-- Account Balance -->
        <div class="balance"></div>
        <!-- Transactions -->
        <div class="transactions"></div>
        <!-- Account Summary -->
        <div class="summary"></div>
        <!-- Transfer -->
        <div class="transfer"></div>
        <!-- Loan -->
        <div class="loan"></div>
        <!-- Close Account -->
        <div class="close"></div>
    </main>
    <script src="scripts.js"></script>
</body>

</html>
