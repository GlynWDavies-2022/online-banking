<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Online Banking</title>
</head>

<body>
    <!-- Navigation Bar -->
    <nav>
        <img src="images/online-banking-image.png" alt="Logo" class="logo">
        <p class="welcome-message">Welcome! Log in to get started</p>
        <form class="form-login">
            <input type="text" placeholder="user" class="form-input">
            <input type="password" placeholder="pin" maxlength="4" class="form-input">
            <button class="button-login">Login</button>
        </form>
    </nav>
    <!-- Main Content Area -->
    <main class="account">
        <!-- Account Balance -->
        <div class="account-balance">
            <div class="account-balance-label-set">
                <p class="account-balance-label">Current balance</p>
                <p class="account-balance-date">As of <span class="date">2030-10-30</span></p>
            </div>
            <p class="account-balance-amount">£23,908.00</p>
        </div>
        <!-- Transactions -->
        <div class="account-transactions"></div>
        <!-- Account Summary -->
        <div class="account-summary">
            <p class="account-summary-direction">IN</p>
            <p class="account-summary-amount">£20,800.00</p>
            <p class="account-summary-direction">OUT</p>
            <p class="account-summary-amount">£10,900.00</p>
            <p class="account-summary-direction">INTEREST</p>
            <p class="account-summary-amount">£500.00</p>
        </div>
        <!-- Transfer -->
        <div class="service service-transfer">
            <h2>Transfer Money</h2>
        </div>
        <!-- Loan -->
        <div class="service service-loan">
            <h2>Loan Money</h2>
        </div>
        <!-- Close Account -->
        <div class="service service-close">
            <h2>Close Account</h2>
        </div>
    </main>
    <script src="scripts.js"></script>
</body>

</html>
